[package]
name = "mnema-core"
version = "1.1.0"
edition = "2021"

[lib]
name = "_core"
# `rlib` too, so the logic is testable without a Python interpreter. It was
# `cdylib` only, which is why a panic on accented text went unnoticed.
crate-type = ["cdylib", "rlib"]

[features]
# `extension-module` was hard-coded onto the pyo3 dependency with no
# `[features]` table, so a test binary could never link and nothing here could
# be tested at all. Empty by default: these are ordinary text helpers.
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.28", optional = true }
